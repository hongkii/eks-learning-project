apiVersion: v1
kind: Pod
metadata:
  name: app-with-ebs
  namespace: default
spec:
  containers:
  - name: app
    image: nginx:latest
    volumeMounts:
    - name: ebs-storage
      mountPath: /data
    ports:
    - containerPort: 80
  volumes:
  - name: ebs-storage
    persistentVolumeClaim:
      claimName: ebs-pvc
