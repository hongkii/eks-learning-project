# Demo app used to check that pods keep serving during a version rollback.
# Each pod renders its own name and the node it runs on.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: default
  labels:
    app: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      # Keeps both pods off the same node while nodes are rolling.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: demo-app
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          env:
            # Pod and node names come from the Downward API.
            # https://kubernetes.io/docs/tasks/inject-data-application/environment-variable-expose-pod-information/
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /usr/share/nginx/html/index.html <<EOF
              <html><body style="font-family:monospace">
              <h1>EKS version rollback check</h1>
              <p>pod : $POD_NAME</p>
              <p>node: $NODE_NAME</p>
              </body></html>
              EOF
              exec nginx -g 'daemon off;'
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: default
spec:
  # ClusterIP avoids the LoadBalancer charge. Reach it through port-forward.
  type: ClusterIP
  selector:
    app: demo-app
  ports:
    - port: 80
      targetPort: 80
---
# Keeps at least one pod available while nodes are rolling.
# https://kubernetes.io/docs/tasks/run-application/configure-pdb/
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: demo-app
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: demo-app
